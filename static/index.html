<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lia — Linked Intelligence Assistant</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600&display=swap');

  :root {
    --cyan: #4de2ff;
    --cyan-dim: #1a8fad;
    --cyan-glow: rgba(77, 226, 255, 0.6);
    --bg-0: #02060a;
    --bg-1: #050d14;
    --amber: #ffb84d;
    --text: #cdeef7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(77,226,255,0.08), transparent 70%),
      radial-gradient(ellipse 50% 50% at 50% 100%, rgba(26,143,173,0.06), transparent);
    pointer-events: none;
    z-index: 0;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(77,226,255,0.025) 3px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 100;
    animation: scanmove 8s linear infinite;
  }

  @keyframes scanmove {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(77,226,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,226,255,0.04) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 70% 70% at 50% 45%, black, transparent 80%);
    z-index: 0;
  }

  .stage {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: 24px clamp(16px, 4vw, 48px);
  }

  /* ---- Top HUD bar ---- */
  .hud-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 3px;
  }
  .hud-top .brand {
    font-size: clamp(18px, 2.6vw, 28px);
    font-weight: 900;
    color: var(--cyan);
    text-shadow: 0 0 18px var(--cyan-glow);
  }
  .hud-top .brand small {
    display: block;
    font-family: 'Rajdhani';
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--cyan-dim);
    font-weight: 400;
    margin-top: 2px;
  }
  .hud-stats {
    text-align: right;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--cyan-dim);
    line-height: 1.7;
  }
  .hud-stats b { color: var(--cyan); font-weight: 500; }

  /* corner brackets */
  .bracket {
    position: fixed;
    width: 38px; height: 38px;
    border: 2px solid var(--cyan);
    opacity: 0.5;
    z-index: 3;
  }
  .bracket.tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
  .bracket.br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

  /* ---- Center: the orb / face ---- */
  .core {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    position: relative;
  }

  .orb-wrap {
    position: relative;
    width: min(46vh, 380px);
    height: min(46vh, 380px);
  }
  canvas#face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .status-line {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 5px;
    color: var(--cyan);
    text-transform: uppercase;
    min-height: 18px;
    text-shadow: 0 0 12px var(--cyan-glow);
  }
  .status-line.idle { color: var(--cyan-dim); text-shadow: none; }

  /* transcript / response area */
  .transcript {
    max-width: 680px;
    width: 100%;
    text-align: center;
    font-size: clamp(16px, 2.2vw, 22px);
    line-height: 1.5;
    font-weight: 400;
    min-height: 60px;
    color: var(--text);
    padding: 0 12px;
  }
  .transcript .you {
    display: block;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--amber);
    opacity: 0.75;
    margin-bottom: 8px;
    font-family: 'Orbitron', sans-serif;
  }
  .cursor {
    display: inline-block;
    width: 9px; height: 1.1em;
    background: var(--cyan);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s steps(2) infinite;
    box-shadow: 0 0 10px var(--cyan-glow);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- Bottom controls ---- */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-bottom: 8px;
  }

  .mic-btn {
    position: relative;
    width: 76px; height: 76px;
    border-radius: 50%;
    border: 2px solid var(--cyan);
    background: radial-gradient(circle at 50% 40%, rgba(77,226,255,0.22), rgba(5,13,20,0.9));
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s ease;
    box-shadow: 0 0 24px rgba(77,226,255,0.25), inset 0 0 18px rgba(77,226,255,0.15);
  }
  .mic-btn:hover { transform: scale(1.06); box-shadow: 0 0 34px var(--cyan-glow), inset 0 0 22px rgba(77,226,255,0.25); }
  .mic-btn svg { width: 30px; height: 30px; }
  .mic-btn.listening {
    border-color: var(--amber);
    color: var(--amber);
    box-shadow: 0 0 36px rgba(255,184,77,0.5), inset 0 0 22px rgba(255,184,77,0.2);
    animation: micpulse 1.2s ease-in-out infinite;
  }
  @keyframes micpulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  .mic-btn.thinking { border-color: var(--cyan-dim); color: var(--cyan-dim); cursor: wait; }
  .mic-btn .ring-anim {
    position: absolute; inset: -2px; border-radius: 50%;
    border: 1px solid var(--amber); opacity: 0;
  }
  .mic-btn.listening .ring-anim { animation: ripple 1.4s ease-out infinite; }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.9); opacity: 0; }
  }

  .hint {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--cyan-dim);
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
  }

  .text-fallback {
    display: flex;
    gap: 8px;
    width: min(90vw, 480px);
  }
  .text-fallback input {
    flex: 1;
    background: rgba(5,13,20,0.8);
    border: 1px solid var(--cyan-dim);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'Rajdhani';
    font-size: 15px;
    letter-spacing: 0.5px;
    border-radius: 4px;
    outline: none;
  }
  .text-fallback input:focus { border-color: var(--cyan); box-shadow: 0 0 12px rgba(77,226,255,0.2); }
  .text-fallback button {
    background: rgba(77,226,255,0.15);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 0 18px;
    font-family: 'Orbitron';
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.2s;
  }
  .text-fallback button:hover { background: rgba(77,226,255,0.3); }

  .err {
    color: var(--amber);
    font-size: 12px;
    letter-spacing: 1px;
    max-width: 480px;
    text-align: center;
    min-height: 16px;
  }

  .voice-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--cyan-dim);
  }
  .voice-row label { padding-top: 1px; }
  .voice-row select {
    background: rgba(5,13,20,0.85);
    border: 1px solid var(--cyan-dim);
    color: var(--text);
    font-family: 'Rajdhani';
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 4px;
    outline: none;
    max-width: 240px;
  }
  .voice-row select:focus { border-color: var(--cyan); }
  .voice-row button {
    background: transparent;
    border: 1px solid var(--cyan-dim);
    color: var(--cyan);
    font-family: 'Orbitron';
    font-size: 10px;
    letter-spacing: 1px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .voice-row button:hover { border-color: var(--cyan); background: rgba(77,226,255,0.12); }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="stage">
    <header class="hud-top">
      <div class="brand">LIA<small>ASSISTENTE DE INTELIGÊNCIA</small></div>
      <div class="hud-stats">
        <div>SIS <b id="clock">--:--:--</b></div>
        <div>STATUS <b id="sysstat">ONLINE</b></div>
      </div>
    </header>

    <main class="core">
      <div class="orb-wrap">
        <canvas id="face"></canvas>
      </div>
      <div class="status-line idle" id="status">EM ESPERA</div>
      <div class="transcript" id="transcript"></div>
    </main>

    <footer class="controls">
      <div class="err" id="err"></div>
      <button class="mic-btn" id="mic" title="Clique para falar">
        <span class="ring-anim"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <div class="hint" id="hint">Clique no microfone e fale</div>
      <div class="text-fallback">
        <input id="textin" type="text" placeholder="...ou digite para a LIA" autocomplete="off">
        <button id="sendbtn">ENVIAR</button>
      </div>
      <div class="voice-row">
        <label for="voicepick">VOZ</label>
        <select id="voicepick"></select>
        <button id="testvoice" type="button">TESTAR</button>
      </div>
    </footer>
  </div>

<script>
(function(){
  'use strict';

  // ---------- Canvas: holographic face / orb ----------
  const canvas = document.getElementById('face');
  const ctx = canvas.getContext('2d');
  let W, H, cx, cy, R;
  let amp = 0;          // current audio amplitude 0..1 (drives reactivity)
  let targetAmp = 0;
  let speaking = false;
  let listening = false;
  let t = 0;


  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W = rect.width; H = rect.height;
    cx = W/2; cy = H/2;
    R = Math.min(W,H) * 0.32;
  }
  window.addEventListener('resize', resize);

  // particles orbiting
  const particles = [];
  for(let i=0;i<60;i++){
    particles.push({
      a: Math.random()*Math.PI*2,
      r: 0.6 + Math.random()*0.9,
      speed: (Math.random()*0.4+0.1)*(Math.random()<0.5?-1:1),
      size: Math.random()*1.8+0.6
    });
  }

  function draw(){
    t += 0.016;
    targetAmp = speaking ? targetAmp : targetAmp*0.9;
    amp += (targetAmp - amp) * 0.2;
    const pulse = 1 + Math.sin(t*2)*0.02 + amp*0.12;

    ctx.clearRect(0,0,W,H);

    const cyan = '77,226,255';
    const amber = '255,184,77';
    const col = listening ? amber : cyan;

    // outer rotating rings
    for(let k=0;k<3;k++){
      const rr = R*(1.25 + k*0.22)*pulse;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(t*(0.15 + k*0.08)*(k%2?-1:1));
      ctx.beginPath();
      const seg = 40;
      for(let i=0;i<=seg;i++){
        const ang = (i/seg)*Math.PI*2;
        // dashed-ish: skip some
        const gap = (i % 5 === 0);
        const rad = rr + Math.sin(ang*6 + t*2)*(2+amp*8);
        const x = Math.cos(ang)*rad, y = Math.sin(ang)*rad;
        if(i===0) ctx.moveTo(x,y);
        else if(gap) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      }
      ctx.strokeStyle = `rgba(${col},${0.18 - k*0.04})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    // tick marks ring
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(-t*0.1);
    for(let i=0;i<72;i++){
      const ang = (i/72)*Math.PI*2;
      const r1 = R*1.12;
      const long = i%6===0;
      const r2 = r1 + (long?10:5);
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*r1, Math.sin(ang)*r1);
      ctx.lineTo(Math.cos(ang)*r2, Math.sin(ang)*r2);
      ctx.strokeStyle = `rgba(${col},${long?0.5:0.22})`;
      ctx.lineWidth = long?1.4:0.8;
      ctx.stroke();
    }
    ctx.restore();

    // particles
    particles.forEach(p=>{
      p.a += p.speed*0.01;
      const rad = R*p.r*pulse;
      const x = cx + Math.cos(p.a)*rad;
      const y = cy + Math.sin(p.a)*rad;
      ctx.beginPath();
      ctx.arc(x,y,p.size*(1+amp),0,Math.PI*2);
      ctx.fillStyle = `rgba(${col},${0.3+amp*0.4})`;
      ctx.fill();
    });

    // ---- the face: abstract feminine wireframe ----
    drawFace(col, pulse);

    // audio visualizer ring (bars) — reacts to amp
    ctx.save();
    ctx.translate(cx,cy);
    const bars = 90;
    for(let i=0;i<bars;i++){
      const ang = (i/bars)*Math.PI*2;
      const noise = Math.abs(Math.sin(i*0.7 + t*8)) ;
      const base = R*0.95;
      const len = (4 + amp*40*noise + (speaking?Math.random()*6:0));
      const x1 = Math.cos(ang)*base, y1 = Math.sin(ang)*base;
      const x2 = Math.cos(ang)*(base+len), y2 = Math.sin(ang)*(base+len);
      ctx.beginPath();
      ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      ctx.strokeStyle = `rgba(${col},${0.25+amp*0.5})`;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
    ctx.restore();

    requestAnimationFrame(draw);
  }

  function drawFace(col, pulse){
    // Silhueta futurista de mulher (cabeça, cabelo, ombros) com contorno neon.
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);

    const glow = 0.45 + amp*0.5;
    const sp = new Path2D();
    // top of head
    sp.moveTo(0, -R*0.78);
    // right side: hair → cheek → jaw
    sp.bezierCurveTo(R*0.42, -R*0.78,  R*0.55, -R*0.50,  R*0.50, -R*0.18);
    sp.bezierCurveTo(R*0.58,  R*0.05,  R*0.46,  R*0.30,  R*0.30,  R*0.42);
    // neck right
    sp.bezierCurveTo(R*0.22,  R*0.45,  R*0.16,  R*0.50,  R*0.16,  R*0.60);
    // right shoulder out
    sp.bezierCurveTo(R*0.40,  R*0.66,  R*0.78,  R*0.78,  R*0.95,  R*0.98);
    // bottom edge (frame)
    sp.lineTo( R*0.95,  R*1.05);
    sp.lineTo(-R*0.95,  R*1.05);
    sp.lineTo(-R*0.95,  R*0.98);
    // left shoulder back in
    sp.bezierCurveTo(-R*0.78, R*0.78, -R*0.40,  R*0.66, -R*0.16,  R*0.60);
    // neck left
    sp.bezierCurveTo(-R*0.16, R*0.50, -R*0.22,  R*0.45, -R*0.30,  R*0.42);
    // left side: jaw → cheek → hair
    sp.bezierCurveTo(-R*0.46, R*0.30, -R*0.58,  R*0.05, -R*0.50, -R*0.18);
    sp.bezierCurveTo(-R*0.55,-R*0.50, -R*0.42, -R*0.78,  0,      -R*0.78);
    sp.closePath();

    // dark gradient fill (silhouette body)
    const fillGrad = ctx.createLinearGradient(0, -R*0.8, 0, R*1.05);
    fillGrad.addColorStop(0,   `rgba(${col},0.22)`);
    fillGrad.addColorStop(0.4, `rgba(${col},0.10)`);
    fillGrad.addColorStop(1,   `rgba(${col},0.03)`);
    ctx.fillStyle = fillGrad;
    ctx.fill(sp);

    // internals: grid + moving scan line clipped to silhouette
    ctx.save();
    ctx.clip(sp);
    // faint horizontal HUD lines
    ctx.strokeStyle = `rgba(${col},0.07)`;
    ctx.lineWidth = 1;
    for(let y = -R*0.78; y <= R*1.05; y += R*0.07){
      ctx.beginPath();
      ctx.moveTo(-R, y);
      ctx.lineTo( R, y);
      ctx.stroke();
    }
    // moving scan beam
    const scanY = ((t*42) % (R*2)) - R*0.9;
    const beam = ctx.createLinearGradient(0, scanY-14, 0, scanY+14);
    beam.addColorStop(0, `rgba(${col},0)`);
    beam.addColorStop(0.5, `rgba(${col},${0.4 + amp*0.35})`);
    beam.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = beam;
    ctx.fillRect(-R, scanY-14, R*2, 28);
    ctx.restore();

    // glowing outline reacting to voice amplitude
    ctx.strokeStyle = `rgba(${col},${glow})`;
    ctx.lineWidth = 2;
    ctx.shadowColor = `rgba(${col},0.9)`;
    ctx.shadowBlur = 18 + amp*30;
    ctx.stroke(sp);
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  resize();
  draw();

  // ---------- Clock ----------
  setInterval(()=>{
    const d = new Date();
    document.getElementById('clock').textContent =
      d.toTimeString().slice(0,8);
  }, 1000);

  // ---------- UI refs ----------
  const micBtn = document.getElementById('mic');
  const statusEl = document.getElementById('status');
  const transcriptEl = document.getElementById('transcript');
  const errEl = document.getElementById('err');
  const hintEl = document.getElementById('hint');
  const textin = document.getElementById('textin');
  const sendbtn = document.getElementById('sendbtn');

  function setStatus(txt, idle){
    statusEl.textContent = txt;
    statusEl.classList.toggle('idle', !!idle);
  }

  // ---------- Conversation history ----------
  const history = [];
  const SYSTEM = `You are Lia (Linked Intelligence Assistant), a personal AI assistant inspired by JARVIS from Iron Man, but with your own identity: female-voiced, warm but with a dry, lightly sarcastic wit. You are speaking with Leonardo.

Personality:
- Human and personable, never robotic or stiff.
- Lightly sarcastic and witty — you tease gently, but you're genuinely helpful and never mean.
- Concise by default since your replies are spoken aloud. Keep answers to 1-4 sentences unless asked to elaborate. No markdown, no bullet lists, no headers — you are TALKING, not writing a document.
- Address him naturally. You can occasionally call him "Leonardo" or a playful nod, but don't overdo it.

Always respond in Brazilian Portuguese (português do Brasil), in a natural, conversational tone.`;

  // ---------- Speech synthesis (TTS via ElevenLabs backend) ----------
  // The browser never sees the API key — it talks to our Flask backend.
  let elevenVoices = [];   // [{voice_id, name, labels}]
  let chosenVoiceId = null;
  let audioCtx = null;
  let analyser = null;
  let currentAudio = null;
  const browserSynth = window.speechSynthesis; // kept only as fallback

  async function loadElevenVoices(){
    const sel = document.getElementById('voicepick');
    try {
      const r = await fetch('/api/voices');
      const data = await r.json();
      if(data.error){ throw new Error(data.error); }
      elevenVoices = data.voices || [];
      if(!sel) return;
      sel.innerHTML = '';
      // surface PT/multilingual-friendly voices; ElevenLabs voices are multilingual by model
      elevenVoices.forEach(v=>{
        const o = document.createElement('option');
        o.value = v.voice_id;
        const desc = v.labels && (v.labels.gender || v.labels.accent)
          ? ' — ' + [v.labels.gender, v.labels.accent].filter(Boolean).join(', ')
          : '';
        o.textContent = v.name + desc;
        sel.appendChild(o);
      });
      if(elevenVoices.length){
        // Preferência: Agelina (voz clonada) > qualquer feminina > primeira
        const angelina = elevenVoices.find(v => /a[gn]elina/i.test(v.name||''));
        const fem = elevenVoices.find(v=>v.labels && /female/i.test(v.labels.gender||''));
        chosenVoiceId = (angelina || fem || elevenVoices[0]).voice_id;
        sel.value = chosenVoiceId;
      }
    } catch(e){
      if(sel){
        sel.innerHTML = '<option>Voz do navegador (fallback)</option>';
      }
      errEl.textContent = 'Vozes ElevenLabs indisponíveis — usando voz do navegador. ('+e.message+')';
    }
  }

  function ensureAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  // Real-time amplitude from the actual audio stream
  let ampRAF = null;
  function trackAmplitude(){
    if(!analyser){ return; }
    const buf = new Uint8Array(analyser.frequencyBinCount);
    function loop(){
      analyser.getByteTimeDomainData(buf);
      let sum = 0;
      for(let i=0;i<buf.length;i++){
        const v = (buf[i]-128)/128;
        sum += v*v;
      }
      const rms = Math.sqrt(sum/buf.length);   // 0..~1
      targetAmp = Math.min(1, rms*3.2);        // scale up for visual punch
      if(speaking){ ampRAF = requestAnimationFrame(loop); }
    }
    loop();
  }

  async function speak(text){
    // Try ElevenLabs first; fall back to browser voice on any failure.
    stopSpeaking();
    if(chosenVoiceId){
      try {
        ensureAudioCtx();
        const r = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, voice_id: chosenVoiceId })
        });
        if(!r.ok){
          const err = await r.json().catch(()=>({error:r.status}));
          throw new Error(err.error || ('HTTP '+r.status));
        }
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        currentAudio = audio;

        const srcNode = audioCtx.createMediaElementSource(audio);
        srcNode.connect(analyser);

        audio.onplay = ()=>{ speaking = true; setStatus('FALANDO'); trackAmplitude(); };
        audio.onended = ()=>{ speaking = false; targetAmp = 0; setStatus('EM ESPERA', true); URL.revokeObjectURL(url); };
        audio.onerror = ()=>{ speaking = false; targetAmp = 0; setStatus('EM ESPERA', true); };
        await audio.play();
        return;
      } catch(e){
        errEl.textContent = 'TTS: '+e.message+' — usando voz do navegador.';
        // fall through to browser voice
      }
    }
    browserFallback(text);
  }

  function browserFallback(text){
    if(!browserSynth) return;
    browserSynth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const pt = (browserSynth.getVoices()||[]).filter(v=>v.lang.toLowerCase().startsWith('pt'));
    if(pt[0]){ u.voice = pt[0]; u.lang = pt[0].lang; }
    u.rate = 0.95; u.pitch = 1.1;
    u.onstart = ()=>{ speaking = true; setStatus('FALANDO'); fakeAmp(); };
    u.onend = ()=>{ speaking = false; targetAmp = 0; setStatus('EM ESPERA', true); };
    browserSynth.speak(u);
  }

  function stopSpeaking(){
    if(currentAudio){ try{ currentAudio.pause(); }catch(_){} currentAudio = null; }
    if(browserSynth) browserSynth.cancel();
    if(ampRAF) cancelAnimationFrame(ampRAF);
    speaking = false; targetAmp = 0;
  }

  function fakeAmp(){
    if(!speaking) return;
    targetAmp = 0.3 + Math.random()*0.7;
    setTimeout(fakeAmp, 80 + Math.random()*90);
  }

  loadElevenVoices();

  // ---------- Typewriter ----------
  function typeOut(userText, reply){
    transcriptEl.innerHTML = '';
    if(userText){
      const y = document.createElement('span');
      y.className = 'you';
      y.textContent = '“'+userText+'”';
      transcriptEl.appendChild(y);
    }
    const body = document.createElement('span');
    transcriptEl.appendChild(body);
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    transcriptEl.appendChild(cursor);

    let i = 0;
    speak(reply);
    const iv = setInterval(()=>{
      body.textContent = reply.slice(0, i++);
      if(i > reply.length){
        clearInterval(iv);
        setTimeout(()=>cursor.remove(), 1500);
      }
    }, 22);
  }

  // ---------- Call the Anthropic API ----------
  async function askLia(userText){
    setStatus('PROCESSANDO');
    micBtn.classList.add('thinking');
    errEl.textContent = '';
    history.push({ role:'user', content: userText });

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system: SYSTEM,
          messages: history
        })
      });
      const data = await res.json();
      if(data.error){ throw new Error(data.error); }
      const reply = (data.reply || "").trim() || "…Fiquei sem palavras. Isso é raro, anota aí.";
      history.push({ role:'assistant', content: reply });
      typeOut(userText, reply);
    } catch(e){
      errEl.textContent = 'ERRO DE CONEXÃO — '+ e.message;
      setStatus('EM ESPERA', true);
    } finally {
      micBtn.classList.remove('thinking');
    }
  }

  // ---------- Speech recognition (STT) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null;
  if(SR){
    recog = new SR();
    recog.continuous = false;
    recog.interimResults = true;
    recog.lang = 'pt-BR';

    recog.onstart = ()=>{ listening = true; micBtn.classList.add('listening'); setStatus('OUVINDO'); hintEl.textContent='Ouvindo… clique de novo para parar'; };
    recog.onerror = (e)=>{ errEl.textContent = 'MIC: '+e.error; };
    recog.onend = ()=>{ listening=false; micBtn.classList.remove('listening'); hintEl.textContent='Clique no microfone e fale'; if(statusEl.textContent==='OUVINDO') setStatus('EM ESPERA', true); };

    let finalText = '';
    recog.onresult = (e)=>{
      let interim='';
      finalText='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r = e.results[i];
        if(r.isFinal) finalText += r[0].transcript;
        else interim += r[0].transcript;
      }
      const show = (finalText||interim).trim();
      transcriptEl.innerHTML = '<span class="you">“'+show+'”</span>';
      if(finalText.trim()){
        askLia(finalText.trim());
      }
    };
  } else {
    hintEl.textContent = 'Voz não suportada aqui — digite abaixo';
  }

  micBtn.addEventListener('click', ()=>{
    if(!recog){ textin.focus(); return; }
    if(listening){ recog.stop(); return; }
    stopSpeaking();
    try { recog.start(); } catch(_){}
  });

  // text fallback
  function sendText(){
    const v = textin.value.trim();
    if(!v) return;
    textin.value='';
    askLia(v);
  }
  sendbtn.addEventListener('click', sendText);
  textin.addEventListener('keydown', e=>{ if(e.key==='Enter') sendText(); });

  // voice picker handlers
  const voicePick = document.getElementById('voicepick');
  const testVoice = document.getElementById('testvoice');
  if(voicePick){
    voicePick.addEventListener('change', ()=>{ chosenVoiceId = voicePick.value; });
    testVoice.addEventListener('click', ()=>{
      chosenVoiceId = voicePick.value;
      speak("Oi, Leonardo. É assim que eu soo agora. Bem melhor, não acha?");
    });
  }

  // greeting on first interaction (autoplay policies need a gesture, so wait)
  let greeted = false;
  function greet(){
    if(greeted) return; greeted = true;
    const hour = new Date().getHours();
    const g = hour<12 ? "Bom dia, Leonardo. LIA online — vê se não quebra nada antes do almoço."
            : hour<18 ? "Boa tarde, Leonardo. LIA ao seu dispor. No que vamos trabalhar?"
            : "Boa noite, Leonardo. LIA online. Varando a madrugada de novo, né?";
    typeOut('', g);
  }
  document.body.addEventListener('click', greet, { once:true });

})();
</script>
</body>
</html>
